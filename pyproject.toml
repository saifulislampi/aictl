[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aictl"
version = "0.1.0"
description = "A small personal control plane for local and remote AI backends and services."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["ollama", "llm", "open-webui", "tmux", "local-ai"]
dependencies = []

[project.scripts]
aictl = "aictl.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
